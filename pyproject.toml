[project]
name = "stockroom"
version = "0.1.0"
description = "Ops agent over messy distributor data: forecasting, anomaly detection, human-approved reorders, with evals."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# added in later phases: sqlglot (P2), lightgbm (P3), anthropic (P4), mcp (P6), fastapi+uvicorn (P7)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockroom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
