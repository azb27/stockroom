[project]
name = "stockroom"
version = "0.1.0"
description = "Ops agent over messy distributor data: forecasting, anomaly detection, human-approved reorders, with evals."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "sqlglot>=25",
  "lightgbm>=4.3",
  "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
# added in later phases: mcp (P6), fastapi+uvicorn (P7)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockroom"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# explicit, so every ruff version enforces the same rules
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ISC", "PLC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # long SQL strings; unicode arrows/× in docs
